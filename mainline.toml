[repo]
ProtectedBranch = 'main'
RemoteName = 'origin'
MainWorktree = '/Users/devrel/Projects/recallnet/codecontext'
WorktreeLayoutPolicy = 'any'
WorktreeRootPrefix = ''
HookPolicy = 'inherit'

[integration]
Strategy = 'rebase-then-ff'
SyncPolicy = 'sync-before-integrate'
DirtyWorktreePolicy = 'reject'

[publish]
Mode = 'manual'
Coalesced = true
InterruptInflight = false

[checks]
PreIntegrate = [
  'pnpm install --frozen-lockfile --ignore-scripts',
  'npx turbo build',
  'pnpm lint',
  'npx turbo typecheck',
  'npx turbo test',
  'pnpm go:qa',
  'pnpm python:qa',
  'pnpm ruby:qa',
  'pnpm docs:lint',
  'pnpm skills:lint',
]
PrePublish = []
CommandTimeout = '5m'
